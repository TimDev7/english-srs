<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English SRS</title>
<style>
  :root { --bg:#14161a; --card:#1e2127; --line:#2c313a; --fg:#e8eaed; --mut:#9aa0a8; --acc:#e5484d; --good:#2fb36d; --bad:#e5484d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:24px; margin:8px 0 16px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:28px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 14px; margin-bottom:14px; }
  .card.center { text-align:center; padding:16px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .btn { display:block; width:100%; padding:14px; margin:12px 0; border:0; border-radius:12px; background:var(--acc); color:#fff; font-size:17px; font-weight:600; cursor:pointer; }
  .btn:active { transform:scale(.99); }
  .link { background:none; border:0; color:var(--mut); font-size:14px; padding:8px 10px; cursor:pointer; text-decoration:underline; }
  .link.danger { color:#e07a7d; }
  .foot { display:flex; justify-content:center; flex-wrap:wrap; gap:4px; margin-top:20px; }
  .muted { color:var(--mut); } .small { font-size:13px; } .big { font-size:20px; }
  .unit { margin-bottom:12px; }
  .uh { display:flex; justify-content:space-between; font-size:15px; margin-bottom:5px; }
  .bar { height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-bottom:14px; }
  .bar.sm { height:6px; margin-bottom:4px; }
  .bar > div { height:100%; background:var(--acc); transition:width .25s; }
  .meta { color:var(--mut); font-size:13px; margin-bottom:10px; }
  .q { font-size:22px; line-height:1.4; margin:6px 0 20px; }
  .blank { display:inline-block; min-width:70px; border-bottom:2px solid var(--acc); margin:0 2px; }
  .opts { display:grid; gap:10px; }
  .opt { padding:14px; font-size:18px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; cursor:pointer; text-align:left; }
  .opt:disabled { cursor:default; }
  .opt.good { border-color:var(--good); background:rgba(47,179,109,.15); }
  .opt.bad { border-color:var(--bad); background:rgba(229,72,77,.15); }
  .inp { width:100%; padding:14px; font-size:18px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; }
  .inp:focus { outline:2px solid var(--acc); }
  .num { width:80px; padding:8px; font-size:16px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; text-align:right; }
  .fb { margin-top:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); }
  .fb.ok { border-color:var(--good); } .fb.no { border-color:var(--bad); }
  .exp { margin-top:6px; color:var(--mut); font-size:15px; }
  .btn.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .two .btn { margin:12px 0 4px; }
  .center { text-align:center; }
  .foot.left { justify-content:flex-start; margin:0 0 4px; }
  .unit { cursor:pointer; padding:8px 10px; border-radius:10px; }
  .unit:hover { background:var(--card); }
  .theory { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .theory ul { margin:8px 0; padding-left:20px; }
  .theory li { margin:6px 0; }
  .formula { font-weight:600; color:#fff; background:rgba(229,72,77,.18); border-left:3px solid var(--acc); border-radius:6px; padding:8px 10px; margin:6px 0 10px; }
  .ex { margin:8px 0; padding:8px 10px; border-radius:8px; background:var(--bg); font-style:italic; }
  .watch { color:var(--mut); font-size:15px; margin-top:8px; }
  .wp { margin:14px 0; }
  .wp label { display:block; margin-bottom:6px; }
  .ta { width:100%; padding:12px; font-size:17px; font-family:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; resize:vertical; }
  .ta:focus { outline:2px solid var(--acc); }
  .chk { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
  .chk:last-child { border-bottom:0; }
  .chk input { flex:none; margin-top:3px; width:20px; height:20px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="units.js"></script>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
